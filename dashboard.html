<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ServiceHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <header class="header" style="position: sticky; top: 0; z-index: 100; background: #111827;">
        <div class="container nav-container">
            <a href="../index.html" class="logo" style="color: white;">
                <i class="fa-solid fa-shield-halved" style="color: var(--primary-color);"></i>
                ServiceHub <span style="font-size: 0.75rem; background: var(--primary-color); color: white; padding: 0.125rem 0.5rem; border-radius: 4px; margin-left: 0.5rem;">ADMIN</span>
            </a>
            <div class="nav-actions">
                <span class="font-medium" style="font-size: 0.875rem; color: white;" id="nav-user-name">
                    <i class="fa-solid fa-user-shield"></i> Admin
                </span>
                <button onclick="logout()" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem; border-color: #374151; color: white;">Logout</button>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar" style="background: #1F2937; border-color: #374151;">
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" style="color: white;">
                    <i class="fa-solid fa-chart-pie"></i> Overview
                </a>
                <a href="#" class="sidebar-link" style="color: #9CA3AF;">
                    <i class="fa-solid fa-users"></i> Users
                </a>
                <a href="#" class="sidebar-link" style="color: #9CA3AF;">
                    <i class="fa-solid fa-user-tie"></i> Providers
                </a>
                <a href="#" class="sidebar-link" style="color: #9CA3AF;">
                    <i class="fa-solid fa-boxes-stacked"></i> Services
                </a>
                <a href="#" class="sidebar-link" style="color: #9CA3AF;">
                    <i class="fa-solid fa-calendar-check"></i> All Bookings
                </a>
            </nav>
        </aside>

        <main class="dashboard-content" style="background: #F3F4F6;">
            <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0;">
                
                <div class="flex justify-between items-center mb-6">
                    <h1>Platform Overview</h1>
                    <button class="btn btn-primary" onclick="initMockData(true)"><i class="fa-solid fa-rotate-right mr-2"></i> Reset Data</button>
                </div>
                
                <div class="grid md-grid-cols-4 gap-6 mb-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="flex justify-between items-center mb-2">
                                <div class="text-muted" style="font-size: 0.875rem;">Total Revenue (Platform Fee)</div>
                                <div style="background: #EEF2FF; color: var(--primary-color); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                            </div>
                            <h2 id="admin-revenue">₹0</h2>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="flex justify-between items-center mb-2">
                                <div class="text-muted" style="font-size: 0.875rem;">Total Bookings</div>
                                <div style="background: #ECFDF5; color: #10B981; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-calendar-check"></i></div>
                            </div>
                            <h2 id="admin-bookings">0</h2>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="flex justify-between items-center mb-2">
                                <div class="text-muted" style="font-size: 0.875rem;">Total Users</div>
                                <div style="background: #FEF3C7; color: #F59E0B; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-users"></i></div>
                            </div>
                            <h2 id="admin-users">0</h2>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="flex justify-between items-center mb-2">
                                <div class="text-muted" style="font-size: 0.875rem;">Active Providers</div>
                                <div style="background: #F3E8FF; color: #8B5CF6; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><i class="fa-solid fa-user-tie"></i></div>
                            </div>
                            <h2 id="admin-providers">0</h2>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <h3 class="mb-4">Recent Platform Activity</h3>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 2px solid var(--border-color);">
                                        <th style="padding: 1rem; color: var(--text-muted); font-weight: 500;">Booking ID</th>
                                        <th style="padding: 1rem; color: var(--text-muted); font-weight: 500;">Service</th>
                                        <th style="padding: 1rem; color: var(--text-muted); font-weight: 500;">Customer</th>
                                        <th style="padding: 1rem; color: var(--text-muted); font-weight: 500;">Amount</th>
                                        <th style="padding: 1rem; color: var(--text-muted); font-weight: 500;">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-activity-table">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
