<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServiceHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-light) 0%, #E0E7FF 100%);
            padding: var(--space-4);
        }
        
        .auth-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 3rem 2rem;
            text-align: center;
        }
        
        .auth-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
        
        .auth-form {
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="auth-card animate-fade-in">
        <a href="index.html" class="auth-logo">
            <i class="fa-solid fa-shield-halved"></i>
            ServiceHub
        </a>
        
        <h2 class="mb-2">Welcome Back</h2>
        <p class="text-muted mb-6">Enter your credentials to access your account.</p>
        
        <div id="auth-error" style="display: none; background: #FEE2E2; color: #B91C1C; padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.875rem;"></div>
        
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <div class="flex justify-between items-center mb-2">
                    <label class="form-label" style="margin: 0;">Password</label>
                    <a href="#" style="font-size: 0.875rem;">Forgot Password?</a>
                </div>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary mt-4" style="width: 100%;">Sign In</button>
        </form>
        
        <p class="mt-6 text-muted" style="font-size: 0.875rem;">
            Don't have an account? <a href="register.html" class="font-bold">Sign up now</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
