<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ServiceHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-light) 0%, #E0E7FF 100%);
            padding: var(--space-4) 0;
        }
        
        .auth-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 3rem 2rem;
            text-align: center;
            margin: 2rem 0;
        }
        
        .auth-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }
        
        .auth-form {
            text-align: left;
        }
        
        .account-type-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .type-btn {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        
        .type-btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
            color: var(--primary-color);
        }
        
        .type-btn i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-card animate-fade-in">
        <a href="index.html" class="auth-logo">
            <i class="fa-solid fa-shield-halved"></i>
            ServiceHub
        </a>
        
        <h2 class="mb-2">Create an Account</h2>
        <p class="text-muted mb-6">Join ServiceHub today to book or provide services.</p>
        
        <div class="account-type-selector">
            <div class="type-btn active" id="type-customer" onclick="setRole('customer')">
                <i class="fa-solid fa-user"></i>
                <div class="font-bold">Customer</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Book services</div>
            </div>
            <div class="type-btn" id="type-provider" onclick="setRole('provider')">
                <i class="fa-solid fa-briefcase"></i>
                <div class="font-bold">Provider</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Offer services</div>
            </div>
        </div>
        
        <div id="auth-error" style="display: none; background: #FEE2E2; color: #B91C1C; padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.875rem;"></div>
        
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary mt-4" style="width: 100%;">Create Account</button>
        </form>
        
        <p class="mt-6 text-muted" style="font-size: 0.875rem;">
            Already have an account? <a href="login.html" class="font-bold">Sign in</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let selectedRole = 'customer';
        function setRole(role) {
            selectedRole = role;
            document.getElementById('type-customer').classList.remove('active');
            document.getElementById('type-provider').classList.remove('active');
            document.getElementById(`type-${role}`).classList.add('active');
        }
    </script>
</body>
</html>
