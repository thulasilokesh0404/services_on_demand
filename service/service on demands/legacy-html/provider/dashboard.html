<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Dashboard - ServiceHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <header class="header" style="position: sticky; top: 0; z-index: 100;">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fa-solid fa-shield-halved"></i>
                ServiceHub
            </a>
            <div class="nav-actions">
                <span class="badge badge-warning mr-4">Provider Mode</span>
                <span class="font-medium text-primary" style="font-size: 0.875rem;" id="nav-user-name">
                    <i class="fa-solid fa-user-tie"></i> Loading...
                </span>
                <button onclick="logout()" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Logout</button>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active">
                    <i class="fa-solid fa-chart-line"></i> Overview
                </a>
                <a href="#" class="sidebar-link">
                    <i class="fa-solid fa-clipboard-list"></i> Job Requests
                    <span class="badge badge-primary ml-auto" style="padding: 0.125rem 0.5rem;" id="job-req-count">0</span>
                </a>
                <a href="#" class="sidebar-link">
                    <i class="fa-solid fa-calendar-days"></i> Calendar
                </a>
                <a href="#" class="sidebar-link">
                    <i class="fa-solid fa-indian-rupee-sign"></i> Earnings
                </a>
                <a href="#" class="sidebar-link">
                    <i class="fa-solid fa-star"></i> Reviews
                </a>
            </nav>
        </aside>

        <main class="dashboard-content">
            <div class="container" style="max-width: 1000px; margin: 0 auto; padding: 0;">
                
                <h1 class="mb-6">Provider Dashboard</h1>
                
                <div class="grid md-grid-cols-4 gap-6 mb-8">
                    <div class="card" style="border-left: 4px solid var(--primary-color);">
                        <div class="card-body">
                            <div class="text-muted mb-2" style="font-size: 0.875rem;">Total Earnings</div>
                            <h2 id="dash-earnings">₹0</h2>
                        </div>
                    </div>
                    <div class="card" style="border-left: 4px solid #10B981;">
                        <div class="card-body">
                            <div class="text-muted mb-2" style="font-size: 0.875rem;">Jobs Completed</div>
                            <h2 id="dash-completed">0</h2>
                        </div>
                    </div>
                    <div class="card" style="border-left: 4px solid #F59E0B;">
                        <div class="card-body">
                            <div class="text-muted mb-2" style="font-size: 0.875rem;">Average Rating</div>
                            <h2 id="dash-rating">0.0 <i class="fa-solid fa-star text-accent" style="font-size: 1rem;"></i></h2>
                        </div>
                    </div>
                    <div class="card" style="border-left: 4px solid #EF4444;">
                        <div class="card-body">
                            <div class="text-muted mb-2" style="font-size: 0.875rem;">Pending Requests</div>
                            <h2 id="dash-pending">0</h2>
                        </div>
                    </div>
                </div>
                
                <div class="grid md-grid-cols-3 gap-8">
                    <div class="md-col-span-2" style="grid-column: span 2;">
                        <h2 class="mb-4">Recent Job Requests</h2>
                        <div id="job-requests-container">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                    
                    <div>
                        <div class="card">
                            <div class="card-body">
                                <h3 class="mb-4">Today's Schedule</h3>
                                <div id="schedule-container">
                                    <div class="text-center text-muted" style="padding: 2rem 0;">
                                        <i class="fa-regular fa-calendar-xmark mb-2" style="font-size: 2rem;"></i>
                                        <p>No jobs scheduled for today.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/provider.js"></script>
</body>
</html>
