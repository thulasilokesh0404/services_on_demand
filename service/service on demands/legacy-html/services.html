<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - ServiceHub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .page-header {
            background-color: var(--primary-light);
            padding: 4rem 0;
            text-align: center;
        }
        
        .filter-sidebar {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        
        .filter-group {
            margin-bottom: 1.5rem;
        }
        
        .filter-title {
            font-size: 1.125rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        
        .search-bar-wrapper {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
        }
        
        /* Service Cards are styled in index.html, we can move it to style.css for sharing but it's ok here if redefined or we use a global class */
        .service-card {
            border: none;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .service-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .service-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navigation Header Setup Same as index.html -->
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-shield-halved"></i>
                ServiceHub
            </a>
            
            <button class="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html" class="text-primary font-bold">Services</a>
                <a href="index.html#how-it-works">How It Works</a>
                <a href="provider/dashboard.html">Become a Provider</a>
            </nav>
            
            <div class="nav-actions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1 class="hero-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Our Services</h1>
            <p class="text-muted">Find and book exactly what you need.</p>
        </div>
    </div>

    <main class="container" style="padding: 4rem 1rem;">
        <div class="grid md-grid-cols-4 gap-8">
            <!-- Sidebar -->
            <aside class="filter-sidebar" style="height: fit-content;">
                <h3 class="mb-4">Filters</h3>
                
                <div class="filter-group">
                    <h4 class="filter-title">Categories</h4>
                    <label class="checkbox-label"><input type="checkbox" value="Cleaning" class="category-filter"> Cleaning</label>
                    <label class="checkbox-label"><input type="checkbox" value="Plumbing" class="category-filter"> Plumbing</label>
                    <label class="checkbox-label"><input type="checkbox" value="Appliance" class="category-filter"> Appliance</label>
                    <label class="checkbox-label"><input type="checkbox" value="Electrician" class="category-filter"> Electrician</label>
                </div>
                
                <div class="filter-group">
                    <h4 class="filter-title">Price Range</h4>
                    <input type="range" min="0" max="2000" value="2000" class="form-control" id="price-range" style="padding: 0;">
                    <div class="flex justify-between mt-2 text-muted" style="font-size: 0.875rem;">
                        <span>₹0</span>
                        <span id="price-display">₹2000</span>
                    </div>
                </div>
            </aside>
            
            <!-- Main Content -->
            <div class="md-col-span-3" style="grid-column: span 3;">
                <div class="search-bar-wrapper">
                    <input type="text" id="search-input" class="form-control" placeholder="Search for a service...">
                    <button class="btn btn-primary" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                
                <div class="flex justify-between items-center mb-6">
                    <h2 style="font-size: 1.5rem;" id="results-count">All Services (4)</h2>
                    <select class="form-control" style="width: auto;" id="sort-select">
                        <option value="recommended">Recommended</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
                
                <div class="grid md-grid-cols-2 xl-grid-cols-3 gap-6" id="services-grid">
                    <!-- Loaded via JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/services.js"></script>
</body>
</html>
